name: Release APK (manual, optional)

# Opt-in only: runs when started by hand. Never on push/PR. Requires repository secrets:
# REPLAY_KEYSTORE_B64, REPLAY_STORE_PASSWORD, REPLAY_KEY_ALIAS, REPLAY_KEY_PASSWORD,
# SPOTIFY_CLIENT_ID, SPOTIFY_OWNER_USER_ID. Without them the job fails before building.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4; includes wrapper validation
      - name: Write ignored config and keystore to runner temp
        env:
          KEYSTORE_B64: ${{ secrets.REPLAY_KEYSTORE_B64 }}
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          OWNER_ID: ${{ secrets.SPOTIFY_OWNER_USER_ID }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$CLIENT_ID" && test -n "$OWNER_ID"
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/replay-release.p12"
          printf 'spotify.clientId=%s\nspotify.ownerUserId=%s\n' "$CLIENT_ID" "$OWNER_ID" > spotify.local.properties
      - name: Build signed release APK
        env:
          REPLAY_SIGNING_STOREFILE: ${{ runner.temp }}/replay-release.p12
          REPLAY_SIGNING_STOREPASSWORD: ${{ secrets.REPLAY_STORE_PASSWORD }}
          REPLAY_SIGNING_KEYALIAS: ${{ secrets.REPLAY_KEY_ALIAS }}
          REPLAY_SIGNING_KEYPASSWORD: ${{ secrets.REPLAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and record checksum
        working-directory: app/build/outputs/apk/release
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app-release.apk | grep -E "Verified using|certificate SHA-256"
          sha256sum app-release.apk > app-release.apk.sha256
          git rev-parse HEAD > source-commit.txt
      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/replay-release.p12" spotify.local.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/source-commit.txt
          if-no-files-found: error
          retention-days: 30
