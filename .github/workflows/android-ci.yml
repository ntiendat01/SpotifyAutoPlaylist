name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          # Override the action's default "tools platform-tools": SDK "tools" is obsolete.
          packages: 'platform-tools'
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4; includes wrapper validation
      - name: JVM tests, Android tests, lint and APK
        # CI has no release key yet: assembleRelease checks the release variant and emits an unsigned APK.
        run: ./gradlew --no-daemon :auth-core:test :spotify-api:test :data:testDebugUnitTest :data:lintDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -Preplay.screenshots="$PWD/app/build/reports/ui"
      - name: Room schema export is committed
        # A changed entity must ship with a version bump, migration and the newly exported schema.
        run: |
          git add --intent-to-add data/schemas
          git diff --exit-code -- data/schemas
      - name: Verify APK signature and record build identity
        working-directory: app/build/outputs/apk/debug
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum --check app-debug.apk.sha256
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-auth-spike-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-spike-test-reports
          path: |
            auth-core/build/reports/tests/
            auth-core/build/test-results/test/TEST-*.xml
            spotify-api/build/reports/tests/
            spotify-api/build/test-results/test/TEST-*.xml
            data/build/reports/tests/
            data/build/test-results/testDebugUnitTest/TEST-*.xml
            data/build/reports/lint-results-debug.html
            data/build/reports/lint-results-debug.xml
            app/build/reports/tests/
            app/build/reports/ui/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
